<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>

  <!-- Glowing Emblem Background Shield -->
  <path d="M 256,96 L 384,160 L 384,288 C 384,360 256,416 256,416 C 256,416 128,360 128,288 L 128,160 Z" 
        fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Emblem Shield Boundary -->
  <path d="M 256,104 L 376,164 L 376,284 C 376,352 256,404 256,404 C 256,404 136,352 136,284 L 136,164 Z" 
        fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Dynamic S-Curve Governance Nodes -->
  <!-- Top Node -->
  <circle cx="216" cy="184" r="18" fill="#ffffff" />
  <circle cx="296" cy="184" r="14" fill="#60a5fa" />
  <!-- Center Node -->
  <circle cx="256" cy="256" r="22" fill="#ffffff" />
  <!-- Bottom Node -->
  <circle cx="216" cy="328" r="14" fill="#818cf8" />
  <circle cx="296" cy="328" r="18" fill="#ffffff" />

  <!-- Connecting Path forming stylized S and Document Lines -->
  <path d="M 296,184 L 216,184 C 180,184 180,256 256,256 C 332,256 332,328 296,328 L 216,328" 
        fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Minimalist Core Cross-Beam -->
  <path d="M 192,256 L 320,256" 
        fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
</svg>
